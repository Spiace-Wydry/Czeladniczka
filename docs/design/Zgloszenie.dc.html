<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Czeladnik — zgłoszenie do mistrza</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3B2716}a:hover{color:#7A4E2D}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: #FFF7E2; font-family: Manrope, system-ui, sans-serif; color: #3B2716; position: relative; overflow: hidden">

  <sc-if value="{{sending}}" hint-placeholder-val="{{ true }}">
    <div style="padding: 36px 20px 0; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: center; gap: 12px">
        <a href="Mistrz.dc.html" aria-label="Wróć" style="display: flex; width: 48px; height: 48px; border-radius: 50%; background: #FBEBC0; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3B2716" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
        </a>
        <h1 style="margin: 0; font-family: 'Zilla Slab', Georgia, serif; font-size: 24px; font-weight: 700">Zgłoszenie do mistrza</h1>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: #F4C542">
        <span style="display: flex; width: 48px; height: 48px; border-radius: 15px; background: #7A4E2D; color: #FFF7E2; align-items: center; justify-content: center; font-family: 'Zilla Slab', Georgia, serif; font-weight: 700; font-size: 18px">HN</span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 800">Henryk Nowak</span><span style="font-size: 13px; font-weight: 600">Stolarstwo · praktyka 3–6 mies.</span></span>
      </div>

      <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
        <legend style="font-weight: 800; font-size: 15px; margin-bottom: 10px; padding: 0">Twoje doświadczenie</legend>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{levels}}" as="l" hint-placeholder-count="3">
            <button onClick="{{l.pick}}" style="{{l.style}}">{{l.label}}</button>
          </sc-for>
        </div>
      </fieldset>

      <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
        <legend style="font-weight: 800; font-size: 15px; margin-bottom: 10px; padding: 0">Kiedy możesz zacząć?</legend>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{starts}}" as="s" hint-placeholder-count="3">
            <button onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
          </sc-for>
        </div>
      </fieldset>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="motywacja" style="font-weight: 800; font-size: 15px">Dlaczego chcesz poznać ten fach?</label>
        <textarea id="motywacja" rows="4" placeholder="Napisz kilka zdań o sobie i o tym, czego chcesz się nauczyć…" style="box-sizing: border-box; width: 100%; padding: 14px 16px; border-radius: 18px; border: 1.5px solid #CDB27A; background: #FFFFFF; font: inherit; font-size: 15px; color: #3B2716; resize: none"></textarea>
      </div>

      <label style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; background: #DCE8CF; font-weight: 700; font-size: 14px; color: #2F5A2C; cursor: pointer">
        <input type="checkbox" checked="" style="width: 22px; height: 22px; accent-color: #3E6B3A; margin: 0">
        Chcę przygotować się do egzaminu czeladniczego
      </label>
    </div>

    <div style="position: absolute; left: 20px; right: 20px; bottom: 22px">
      <button onClick="{{send}}" style="width: 100%; height: 56px; border-radius: 28px; border: none; background: #3B2716; color: #FFF7E2; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer">Wyślij zgłoszenie</button>
    </div>
  </sc-if>

  <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
    <div style="height: 915px; box-sizing: border-box; padding: 0 28px 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; background: #3E6B3A; color: #FFF7E2">
      <span style="display: flex; width: 112px; height: 112px; border-radius: 50%; background: #F4C542; align-items: center; justify-content: center">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#3B2716" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
      </span>
      <h1 style="margin: 0; font-family: 'Zilla Slab', Georgia, serif; font-size: 34px; font-weight: 700; line-height: 1.1">Zgłoszenie wysłane!</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.5; max-width: 300px">Mistrz Henryk dostał Twoją wiadomość. Damy Ci znać, gdy odpowie.</p>
      <a href="Home.dc.html" style="display: flex; margin-top: 12px; height: 56px; padding: 0 32px; border-radius: 28px; background: #F4C542; color: #3B2716; align-items: center; justify-content: center; font-weight: 800; text-decoration: none">Szukaj dalej</a>
      <button onClick="{{reset}}" style="border: none; background: transparent; color: #FFF7E2; font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; min-height: 44px">Edytuj zgłoszenie</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { level: 'zero', start: 'zaraz', sent: false };
  }
  renderVals() {
    const chip = (on) => 'min-height: 44px; padding: 0 16px; border-radius: 22px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; ' +
      (on ? 'background: #3B2716; color: #FFF7E2; border: 1.5px solid #3B2716' : 'background: #FFFFFF; color: #3B2716; border: 1.5px solid #CDB27A');
    const levels = [
      { id: 'zero', label: 'Zaczynam od zera' },
      { id: 'hobby', label: 'Hobbystycznie' },
      { id: 'szkola', label: 'Szkoła zawodowa' }
    ].map((l) => ({ ...l, style: chip(this.state.level === l.id), pick: () => this.setState({ level: l.id }) }));
    const starts = [
      { id: 'zaraz', label: 'Od zaraz' },
      { id: 'miesiac', label: 'Za miesiąc' },
      { id: 'wakacje', label: 'W wakacje' }
    ].map((s) => ({ ...s, style: chip(this.state.start === s.id), pick: () => this.setState({ start: s.id }) }));
    return {
      levels, starts,
      sent: this.state.sent,
      sending: !this.state.sent,
      send: () => this.setState({ sent: true }),
      reset: () => this.setState({ sent: false })
    };
  }
}
</script>
</body>
</html>
