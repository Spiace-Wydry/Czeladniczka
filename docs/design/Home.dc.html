<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Czeladnik — szukaj mistrza</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3B2716}a:hover{color:#7A4E2D}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; background: #FFF7E2; font-family: Manrope, system-ui, sans-serif; color: #3B2716; position: relative; overflow: hidden">

  <div style="background: #F4C542; padding: 40px 20px 28px; border-radius: 0 0 32px 32px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; font-weight: 600">Cześć, [Imię]!</span>
        <h1 style="margin: 0; font-family: 'Zilla Slab', Georgia, serif; font-size: 30px; line-height: 1.1; font-weight: 700">Czego chcesz<br>się nauczyć?</h1>
      </div>
      <button aria-label="Powiadomienia" style="width: 48px; height: 48px; border-radius: 50%; border: none; background: #3B2716; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4C542" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
      </button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="szukaj" style="font-size: 13px; font-weight: 700">Szukaj rzemiosła lub mistrza</label>
      <div style="display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 8px 0 16px; border-radius: 27px; background: #FFF7E2">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B5440" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <input id="szukaj" type="search" placeholder="np. stolarstwo, kowalstwo…" style="flex: 1; min-width: 0; border: none; background: transparent; font: inherit; font-size: 15px; color: #3B2716; outline: none">
        <button aria-label="Filtry" style="width: 40px; height: 40px; border-radius: 50%; border: none; background: #3B2716; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFF7E2" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M7 12h10"></path><path d="M10 18h4"></path></svg>
        </button>
      </div>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
        <button onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="padding: 22px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h2 style="margin: 0; font-family: 'Zilla Slab', Georgia, serif; font-size: 22px; font-weight: 700">Rzemiosła</h2>
      <a href="Home.dc.html" style="font-size: 14px; font-weight: 700; color: #3E6B3A">Wszystkie</a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{crafts}}" as="c" hint-placeholder-count="8">
        <button style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; border: none; background: transparent; cursor: pointer; font: inherit; color: #3B2716">
          <span style="{{c.tile}}">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>
          </span>
          <span style="font-size: 12px; font-weight: 600">{{c.label}}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 6px">
      <h2 style="margin: 0; font-family: 'Zilla Slab', Georgia, serif; font-size: 22px; font-weight: 700">Mistrzowie w pobliżu</h2>
      
    </div>
    <sc-for list="{{masters}}" as="m" hint-placeholder-count="2">
      <a href="Mistrz.dc.html" style="display: flex; gap: 14px; padding: 14px; border-radius: 20px; background: #FFFFFF; border: 1px solid #EAD9AE; text-decoration: none; color: #3B2716">
        <span style="{{m.avatar}}">{{m.initials}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <span style="display: flex; justify-content: space-between; gap: 8px">
            <span style="font-weight: 800; font-size: 16px">{{m.name}}</span>
            <span style="display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: 14px">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="#E0A422" stroke="#B37E12" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z"></path></svg>{{m.rating}}
            </span>
          </span>
          <span style="font-size: 14px; color: #6B5440">{{m.craft}} · {{m.place}}</span>
          <span style="display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap">
            <span style="padding: 4px 10px; border-radius: 12px; background: #DCE8CF; color: #2F5A2C; font-size: 12px; font-weight: 700">{{m.status}}</span>
            <span style="padding: 4px 10px; border-radius: 12px; background: #FBEBC0; color: #6E4A1E; font-size: 12px; font-weight: 700">{{m.term}}</span>
          </span>
        </span>
      </a>
    </sc-for>
  </div>

  <nav aria-label="Nawigacja główna" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #FBEBC0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; border-top: 1px solid #EAD9AE">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #3B2716; font-size: 12px; font-weight: 800">
      <span style="display: flex; width: 64px; height: 32px; border-radius: 16px; background: #F4C542; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3B2716" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></span>
      Szukaj
    </a>
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B5440; font-size: 12px; font-weight: 600">
      <span style="display: flex; width: 64px; height: 32px; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B5440" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></span>
      Zapisane
    </a>
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B5440; font-size: 12px; font-weight: 600">
      <span style="display: flex; width: 64px; height: 32px; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B5440" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></span>
      Wiadomości
    </a>
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B5440; font-size: 12px; font-weight: 600">
      <span style="display: flex; width: 64px; height: 32px; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B5440" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></span>
      Profil
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'blisko' };
  }
  renderVals() {
    const chip = (on) => 'height: 36px; padding: 0 14px; border-radius: 18px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; ' +
      (on ? 'background: #3B2716; color: #FFF7E2; border: 1.5px solid #3B2716' : 'background: transparent; color: #3B2716; border: 1.5px solid #3B2716');
    const filters = [
      { id: 'blisko', label: 'Do 20 km' },
      { id: 'platna', label: 'Płatna praktyka' },
      { id: 'zaraz', label: 'Od zaraz' }
    ].map((f) => ({ ...f, style: chip(this.state.filter === f.id), pick: () => this.setState({ filter: f.id }) }));
    const tile = (bg) => 'display: flex; width: 64px; height: 64px; border-radius: 20px; align-items: center; justify-content: center; background: ' + bg;
    const crafts = [
      { label: 'Stolarstwo', icon: 'M2 7h20v3H2zM5 10v10M19 10v10M5 15h14', bg: '#FBEBC0', ink: '#7A4E2D' },
      { label: 'Kowalstwo', icon: 'M3 9h14l4-3v6h-4l-2 3H7l-2-3H3zM9 15v4M13 15v4M7 19h8', bg: '#DCE8CF', ink: '#2F5A2C' },
      { label: 'Murarstwo', icon: 'M3 5h18v14H3zM3 10h18M3 14.5h18M9 5v5M15 10v4.5M9 14.5V19', bg: '#F1DCC8', ink: '#7A4E2D' },
      { label: 'Elektryka', icon: 'M13 2L5 14h6l-1 8 8-12h-6z', bg: '#FBEBC0', ink: '#7A4E2D' },
      { label: 'Hydraulika', icon: 'M3 9h11a4 4 0 0 1 4 4v2h-4v-2H3zM9 9V6M6 6h6M16 18v2', bg: '#DCE8CF', ink: '#2F5A2C' },
      { label: 'Ślusarstwo', icon: 'M15 3a5 5 0 0 0-4.6 6.9L3 17.3V21h3.7l7.4-7.4A5 5 0 1 0 15 3z', bg: '#F1DCC8', ink: '#7A4E2D' },
      { label: 'Tapicerstwo', icon: 'M4 11V8a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v3M2 11h20v6H2zM5 17v3M19 17v3', bg: '#FBEBC0', ink: '#7A4E2D' },
      { label: 'Krawiectwo', icon: 'M3 6a3 3 0 1 0 6 0a3 3 0 1 0-6 0M3 18a3 3 0 1 0 6 0a3 3 0 1 0-6 0M20 4L8.12 15.88M14.47 14.48L20 20M8.12 8.12L12 12', bg: '#DCE8CF', ink: '#2F5A2C' }
    ].map((c) => ({ ...c, tile: tile(c.bg) }));
    const av = (bg, fg) => 'display: flex; flex: none; width: 56px; height: 56px; border-radius: 18px; align-items: center; justify-content: center; font-family: "Zilla Slab", Georgia, serif; font-size: 22px; font-weight: 700; background: ' + bg + '; color: ' + fg;
    const masters = [
      { initials: 'HN', name: 'Henryk Nowak', craft: 'Stolarz meblowy', place: 'Sochaczew, 4 km', rating: '4,9', status: 'Przyjmuje uczniów', term: '3–6 mies.', avatar: av('#7A4E2D', '#FFF7E2') },
      { initials: 'MW', name: 'Maria Wójcik', craft: 'Tapicerka', place: 'Łowicz, 18 km', rating: '4,8', status: 'Przyjmuje uczniów', term: 'Weekendy', avatar: av('#3E6B3A', '#FFF7E2') }
    ];
    return { filters, crafts, masters };
  }
}
</script>
</body>
</html>
